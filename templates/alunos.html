
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 450px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 12px #0002;
        }

        h2 {
            text-align: center;
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="radio"] {
            width: auto;
        }

        .sexo {
            display: flex;
            gap: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Cadastro de Alunos</h2>

        <form action="/cadastrar" method="POST">

            <label for="matricula">Matrícula</label>
            <input type="number" id="matricula"
                   name="matricula" required>

            <label for="nome">Nome</label>
            <input type="text" id="nome"
                   name="nome" required>

            <label for="sobrenome">Sobrenome</label>
            <input type="text" id="sobrenome"
                   name="sobrenome" required>

            <label>Sexo</label>
            <div class="sexo">
                <label>
                    <input type="radio" name="sexo"
                           value="Masculino" required>
                    Masculino
                </label>

                <label>
                    <input type="radio" name="sexo"
                           value="Feminino">
                    Feminino
                </label>
            </div>

            <label for="email">E-mail</label>
            <input type="email" id="email"
                   name="email" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha"
                   name="senha" required>

            <label for="turma">Turma</label>
            <select id="turma" name="turma" required>
                <option value="0">Selecione ...</option>
                {% for turma in turmas %}
                 <option value="{{ turma[0] }}">{{ turma[1] }}</option>
                {% endfor %}
                
            </select>

            <button type="submit">Cadastrar Aluno</button>

        </form> 

    </div>

    
</body>
</html>
